name: Speel het spel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  play:
    name: Speel alle hoofdstukken
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installeer de afhankelijkheden
        run: npm ci

      - name: Installeer de browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Speel het spel
        run: npx playwright test
        env:
          PW_FIREFOX: '1'

      - name: Bewaar het testrapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
