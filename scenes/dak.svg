<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-dak" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Op de daken in de nacht">
  <defs>
    <linearGradient id="dkSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b22"/><stop offset=".7" stop-color="#1c2856"/><stop offset="1" stop-color="#34407a"/></linearGradient>
    <radialGradient id="dkMoon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe6" stop-opacity=".6"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient>
    <pattern id="dkTiles" width="40" height="24" patternUnits="userSpaceOnUse"><rect width="40" height="24" fill="#7a2e22"/><path d="M0 23 H40 M20 0 V12 M0 12 H40 M40 12 V24 M0 12 V24" stroke="#4e1a12" stroke-width="2"/><path d="M2 2 q18 6 36 0" stroke="#8f3a2c" stroke-width="2" fill="none"/></pattern>
    <pattern id="dkBrick" width="30" height="16" patternUnits="userSpaceOnUse"><rect width="30" height="16" fill="#8a3e2a"/><path d="M0 15.5 H30 M15 0 V8 M0 8 H30 M0 8 V16 M30 8 V16" stroke="#5a2618" stroke-width="2"/></pattern>
    <radialGradient id="dkLamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd58a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient>
    <radialGradient id="dkVign" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <radialGradient id="dkSkin" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#f6d0ae"/><stop offset="1" stop-color="#d39a76"/></radialGradient>
    <linearGradient id="dkSuit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59a3c"/><stop offset="1" stop-color="#c9661a"/></linearGradient>
    <linearGradient id="dkGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9c64"/><stop offset="1" stop-color="#1f5e39"/></linearGradient>
  </defs>

  <!-- de nachtlucht -->
  <rect width="1600" height="900" fill="url(#dkSky)"/>
  <g id="dk-stars" fill="#fff"></g>
  <circle cx="1380" cy="150" r="160" fill="url(#dkMoon)"/>
  <circle cx="1380" cy="150" r="58" fill="#fff6d2"/>
  <circle cx="1362" cy="136" r="10" fill="#efe4b8"/><circle cx="1400" cy="170" r="7" fill="#efe4b8"/>

  <!-- de kerktoren met de windhaan -->
  <g id="dk-church">
    <path d="M190 120 L220 40 L250 120 Z" fill="#141a36"/>
    <rect x="186" y="120" width="68" height="460" fill="#161d3c"/>
    <rect x="206" y="160" width="28" height="44" rx="14" fill="#f6d77a" opacity=".7"/>
    <circle cx="220" cy="250" r="20" fill="#e9e3c8"/><path d="M220 250 V236 M220 250 L230 256" stroke="#161d3c" stroke-width="3"/>
    <path d="M220 40 V10" stroke="#c9a24a" stroke-width="3"/>
    <g id="dk-vane"><path d="M196 18 H244" stroke="#c9a24a" stroke-width="3"/><path d="M196 18 l-8 -5 v10z" fill="#c9a24a"/>
      <path transform="translate(440 0) scale(-1 1)" d="M214 16 q-6 -14 6 -18 q4 -6 8 0 l6 2 -5 3 q4 10 -4 13 h10 l-2 -10 q8 4 8 12z" fill="#c9a24a"/></g>
  </g>

  <!-- de huizen aan de overkant, met schoorstenen -->
  <g id="dk-far">
    <path d="M260 580 V400 L330 340 L400 400 V580Z" fill="#1d2448"/><rect x="350" y="352" width="18" height="34" fill="#1d2448"/>
    <path d="M400 580 V420 H420 V400 H440 V380 H480 V400 H500 V420 H520 V580Z" fill="#232a52"/>
    <path d="M520 580 V390 L600 330 L680 390 V580Z" fill="#1b2244"/><rect x="620" y="338" width="20" height="40" fill="#1b2244"/>
    <path d="M680 580 V410 L750 360 L820 410 V580Z" fill="#212850"/><rect x="760" y="364" width="18" height="34" fill="#212850"/>
    <path d="M820 580 V400 H840 V380 H860 V360 H900 V380 H920 V400 H940 V580Z" fill="#1d2448"/>
    <path d="M940 580 V420 L1010 360 L1080 420 V580Z" fill="#232a52"/><rect x="1030" y="370" width="18" height="34" fill="#232a52"/>
    <path d="M1080 580 V386 H1250 V580Z" fill="#1b2244"/><rect x="1074" y="380" width="182" height="8" fill="#141a36"/>
    <path d="M1240 580 V420 L1310 370 L1380 420 V580Z" fill="#212850"/><rect x="1330" y="376" width="18" height="34" fill="#212850"/>
    <path d="M1380 580 V400 H1400 V380 H1420 V360 H1460 V380 H1480 V400 H1500 V580Z" fill="#1d2448"/>
    <path d="M1500 580 V410 L1560 360 L1620 410 V580Z" fill="#232a52"/>
    <g fill="#f6d77a"><rect x="300" y="450" width="16" height="22"/><rect x="440" y="460" width="16" height="22" opacity=".7"/><rect x="580" y="440" width="16" height="22"/><rect x="720" y="470" width="16" height="22" opacity=".6"/>
      <rect x="870" y="440" width="16" height="22"/><rect x="990" y="470" width="16" height="22"/><rect x="1150" y="450" width="16" height="22" opacity=".7"/><rect x="1300" y="470" width="16" height="22"/><rect x="1430" y="440" width="16" height="22" opacity=".7"/></g>
    <!-- rook uit twee schoorstenen: de wind blaast hem naar rechts -->
    <g class="dk-smoke"><circle cx="629" cy="326" r="10" fill="#9aa3c4" opacity=".5"/><circle cx="650" cy="314" r="13" fill="#9aa3c4" opacity=".4"/><circle cx="676" cy="306" r="15" fill="#9aa3c4" opacity=".3"/></g>
    <g class="dk-smoke b"><circle cx="1339" cy="364" r="10" fill="#9aa3c4" opacity=".5"/><circle cx="1360" cy="352" r="13" fill="#9aa3c4" opacity=".4"/><circle cx="1386" cy="344" r="15" fill="#9aa3c4" opacity=".3"/></g>
  </g>

  <!-- Sinterklaas op Ozosnel, op een dak in het maanlicht -->
  <g transform="translate(0 22)"><g id="dk-sint" class="dk-ride">
    <path d="M1144 326 q-14 4 -18 18 q-2 8 -8 10 q10 2 16 -8 q4 -8 10 -12z" fill="#b9bfc8"/>
    <path d="M1140 330 q20 -10 50 -6 q20 2 34 -4 l6 -14 l6 4 -4 14 q4 6 -2 12 l-4 34 h-6 l0 -26 h-50 l-4 26 h-6 l0 -30 q-14 -4 -20 -10z" fill="#ece9e0"/>
    <path d="M1150 340 l-14 14" stroke="#ece9e0" stroke-width="6" stroke-linecap="round"/>
    <path d="M1222 312 q-6 4 -10 14 q6 -2 12 -6z" fill="#b9bfc8"/>
    <circle cx="1233" cy="314" r="1.4" fill="#222"/>
    <path d="M1226 318 l-10 10" stroke="#c21f2b" stroke-width="1.6"/>
    <path d="M1162 330 h30 v8 h-30z" fill="#c21f2b"/><path d="M1162 337 h30" stroke="#f2b631" stroke-width="1.6"/>
    <path d="M1172 326 q-14 -26 4 -46 q18 16 14 46z" fill="#c21f2b"/>
    <path d="M1172 326 q-14 -26 4 -46" stroke="#f2b631" stroke-width="1.6" fill="none"/>
    <path d="M1176 300 h8 v26 h-8z" fill="#f6f3ea"/>
    <path d="M1185 300 q8 6 10 18" stroke="#c21f2b" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="1195" cy="319" r="2.6" fill="#fff"/>
    <path d="M1170 286 l4 -22 q6 -8 12 0 l4 22z" fill="#c21f2b" stroke="#f2b631" stroke-width="2"/>
    <path d="M1180 268 v10 M1176.5 272 h7" stroke="#f2b631" stroke-width="1.6"/>
    <circle cx="1180" cy="292" r="7" fill="#efc3a3"/><path d="M1172.5 292 q7.5 22 15 0 q-3 4 -7.5 4 q-4.5 0 -7.5 -4z" fill="#fff"/>
    <circle cx="1177.6" cy="290.6" r="1" fill="#2a1d18"/><circle cx="1182.4" cy="290.6" r="1" fill="#2a1d18"/>
    <path d="M1196 320 V262" stroke="#f2b631" stroke-width="3"/><path d="M1196 264 q0 -12 -8 -12 q-6 0 -6 6" stroke="#f2b631" stroke-width="3" fill="none"/>
  </g></g>

  <!-- de straat met de lantaarnpaal en het straatnaambord -->
  <rect y="580" width="1600" height="40" fill="#121630"/>
  <circle cx="770" cy="500" r="80" fill="url(#dkLamp)"/>
  <rect x="764" y="500" width="10" height="120" fill="#2a2a2a"/>
  <path d="M752 500 h34 l-6 -20 h-22z" fill="#2a2a2a"/><rect x="758" y="500" width="22" height="10" fill="#ffe7a0"/>
  <rect x="780" y="530" width="120" height="30" rx="4" fill="#1f4fa8" stroke="#fff" stroke-width="2"/>
  <text x="840" y="550" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="13" fill="#fff">Pepernotenstraat</text>

  <!-- ons dak: pannen, de schoorsteen, Klimpiet, de zak en het touw -->
  <path d="M-20 900 L-20 690 Q800 600 1620 690 L1620 900Z" fill="url(#dkTiles)"/>
  <path d="M-20 690 Q800 600 1620 690" stroke="#3a120c" stroke-width="12" fill="none"/>
  <g id="dk-chimney">
    <rect x="560" y="520" width="140" height="160" fill="url(#dkBrick)"/>
    <rect x="548" y="508" width="164" height="22" fill="#6b2e1e"/>
    <rect x="574" y="512" width="112" height="12" fill="#0b0b10"/>
    <path d="M560 680 L700 680 L700 660 L560 670Z" fill="#4e1a12"/>
  </g>
  <!-- het touw -->
  <g id="dk-rope">
    <ellipse cx="420" cy="720" rx="46" ry="16" fill="none" stroke="#c9a467" stroke-width="7"/>
    <ellipse cx="420" cy="714" rx="34" ry="12" fill="none" stroke="#b8935a" stroke-width="7"/>
    <ellipse cx="420" cy="708" rx="22" ry="8" fill="none" stroke="#c9a467" stroke-width="6"/>
  </g>
  <!-- de speculaaspop -->
  <g id="dk-koek"><path d="M300 690 a8 8 0 0 1 8 8 a8 8 0 0 1 -2 5 l10 6 -2 4 -9 -3 2 8 5 10 -4 2 -8 -10 -8 10 -4 -2 5 -10 2 -8 -9 3 -2 -4 10 -6 a8 8 0 0 1 -2 -5 a8 8 0 0 1 8 -8z" fill="#b8742f" stroke="#7a4518" stroke-width="1.5"/></g>
  <!-- Klimpiet, op de nok van het dak -->
  <g id="dk-piet" class="dk-swing">
    <path d="M930 640 q-10 30 -30 40" stroke="#2e7d4f" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M960 640 q10 30 30 40" stroke="#ef8a2e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M884 688 q0 -10 14 -10 q12 0 14 10z M978 688 q2 -10 14 -10 q14 0 14 10z" fill="#1a1a1a"/>
    <circle cx="898" cy="682" r="2.4" fill="#f2b631"/><circle cx="992" cy="682" r="2.4" fill="#f2b631"/>
    <ellipse cx="945" cy="630" rx="30" ry="18" fill="url(#dkGreen)"/>
    <path d="M930 616 q-3 14 0 28 M945 613 v34 M960 616 q3 14 0 28" stroke="#174a2c" stroke-width="2" fill="none" opacity=".6"/>
    <path d="M920 630 q25 12 50 0" stroke="#ef8a2e" stroke-width="3" fill="none"/>
    <rect x="924" y="566" width="42" height="60" rx="8" fill="url(#dkSuit)"/><path d="M945 568 v56" stroke="#2e7d4f" stroke-width="10"/>
    <g fill="#f2b631"><circle cx="945" cy="584" r="2.2"/><circle cx="945" cy="600" r="2.2"/></g>
    <path d="M924 580 q-24 10 -34 -16" stroke="#ef8a2e" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="890" cy="562" r="7" fill="#e3ad88"/>
    <path d="M966 580 q22 14 20 36" stroke="#ef8a2e" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="986" cy="618" r="7" fill="#e3ad88"/>
    <rect x="939" y="552" width="12" height="10" fill="#d39a76"/>
    <ellipse cx="945" cy="564" rx="25" ry="7" fill="#fff" stroke="#d9d9e0" stroke-width="1.2"/>
    <path d="M922 565 q2.9 3.6 5.75 0 q2.9 3.6 5.75 0 q2.9 3.6 5.75 0 q2.9 3.6 5.75 0 q2.9 3.6 5.75 0 q2.9 3.6 5.75 0 q2.9 3.6 5.75 0 q2.9 3.6 5.75 0" stroke="#cfcfda" stroke-width="1" fill="none"/>
    <ellipse cx="929" cy="545" rx="3" ry="4.4" fill="#d39a76"/><ellipse cx="961" cy="545" rx="3" ry="4.4" fill="#d39a76"/>
    <ellipse cx="945" cy="544" rx="16" ry="17" fill="url(#dkSkin)"/>
    <g fill="#8a4a22"><circle cx="931" cy="534" r="4.6"/><circle cx="934" cy="530" r="4.6"/><circle cx="959" cy="534" r="4.6"/><circle cx="956" cy="530" r="4.6"/><circle cx="961" cy="539" r="3.2"/><path d="M929 538 q1 -13 16 -13 q15 0 16 13 q-6 -7 -16 -7 q-10 0 -16 7z"/></g>
    <ellipse cx="935" cy="551" rx="5" ry="2.4" fill="#3a2e2a" opacity=".38" transform="rotate(-18 935 551)"/><ellipse cx="954" cy="536" rx="4" ry="2" fill="#3a2e2a" opacity=".32" transform="rotate(20 954 536)"/><ellipse cx="947" cy="549" rx="2" ry="1.2" fill="#3a2e2a" opacity=".35"/>
    <circle cx="955" cy="550" r="3" fill="#ee7f6e" opacity=".35"/>
    <g fill="#fff"><ellipse cx="939.5" cy="542" rx="3" ry="3.4"/><ellipse cx="951.5" cy="542" rx="3" ry="3.4"/></g>
    <g fill="#2c4a20"><circle cx="940.2" cy="542.4" r="1.9"/><circle cx="952.2" cy="542.4" r="1.9"/></g>
    <g fill="#fff"><circle cx="940.8" cy="541.6" r=".6"/><circle cx="952.8" cy="541.6" r=".6"/></g>
    <path d="M935 537 q4 -2 8 0 M947.5 534.5 q4 -3.4 8 0" stroke="#6a3618" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M936 550 q9.5 10 19 -1 q-9.5 3 -19 1z" fill="#8a2d2a"/>
    <path d="M937.5 550.4 q8 2 16 -.4 l-.7 1.6 q-7.3 1.8 -14.6 0z" fill="#fff"/>
    <g id="dk-cap"><ellipse cx="945" cy="528" rx="22" ry="8" fill="url(#dkGreen)" transform="rotate(8 945 528)"/><path d="M925 530 q20 7 40 3" stroke="#f2b631" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M950 524 q22 -26 38 -20 q-16 2 -32 24" fill="#f7c843"/><circle cx="952" cy="526" r="2.4" fill="#ef8a2e"/></g>
  </g>
  <!-- de jutezak met het lettersslot -->
  <g id="dk-sack">
    <path d="M1080 700 q-14 -70 24 -92 l20 -16 l20 16 q36 22 26 92z" fill="#b9935a" stroke="#7a5a2a" stroke-width="3"/>
    <path d="M1104 606 q20 10 40 0" stroke="#7a5a2a" stroke-width="5" fill="none"/>
    <path d="M1100 640 l6 6 M1150 660 l-6 4 M1120 680 l4 -6" stroke="#8a6a3a" stroke-width="2"/>
    <g id="dk-sacklock"><rect x="1112" y="610" width="26" height="20" rx="3" fill="#f2c94c" stroke="#7a5a1a" stroke-width="2"/><path d="M1116 610 v-8 a9 9 0 0 1 18 0 v8" stroke="#7a5a1a" stroke-width="3" fill="none"/></g>
    <g id="dk-gifts" style="display:none"><rect x="1100" y="588" width="22" height="20" fill="#c21f2b"/><rect x="1128" y="582" width="24" height="26" fill="#1f4fa8"/><path d="M1111 588 v20 M1140 582 v26" stroke="#f2b631" stroke-width="3"/></g>
  </g>
  <!-- de ladder tegen de dakgoot -->
  <g id="dk-ladder"><path d="M1400 900 L1440 600 M1460 900 L1500 600" stroke="#8a6a3a" stroke-width="9"/>
    <g stroke="#8a6a3a" stroke-width="6"><path d="M1395 860 h56 M1401 815 h56 M1407 770 h56 M1413 725 h56 M1419 680 h56 M1425 635 h56"/></g></g>
  <!-- het touw in de schoorsteen (als het pakje naar beneden gaat) -->
  <g id="dk-ropein" style="display:none"><path d="M630 512 V470 q0 -30 30 -40 q40 -10 80 40 l50 120" stroke="#c9a467" stroke-width="5" fill="none"/></g>
  <!-- de muts die wegwaait -->
  <g id="dk-flycap" style="display:none"><g class="dk-capfly"><ellipse cx="0" cy="0" rx="22" ry="8" fill="#2e7d4f"/><path d="M5 -4 q22 -26 38 -20 q-16 2 -32 24" fill="#f2b631"/></g></g>

  <rect width="1600" height="900" fill="url(#dkVign)" pointer-events="none"/>

  <!-- klikvlakken -->
  <g>
    <rect class="hit" data-hs="windhaan" data-label="Windhaan op de kerktoren" x="176" y="0" width="94" height="130"/>
    <rect class="hit" data-hs="kerk3" data-label="Kerktoren" x="182" y="130" width="76" height="440"/>
    <rect class="hit" data-hs="sint3" data-label="Sinterklaas op Ozosnel" x="1120" y="262" width="130" height="140"/>
    <rect class="hit" data-hs="maan" data-label="De maan" x="1316" y="88" width="128" height="126"/>
    <rect class="hit" data-hs="huizen" data-label="De huizen aan de overkant" x="270" y="330" width="480" height="240"/>
    <rect class="hit" data-hs="bord" data-label="Straatnaambord" x="752" y="470" width="152" height="100"/>
    <rect class="hit" data-hs="schoorsteen" data-label="Schoorsteen" x="546" y="500" width="168" height="180"/>
    <rect class="hit" data-hs="touw" data-label="Een rol touw" x="370" y="690" width="104" height="52" id="hit-rope"/>
    <rect class="hit" data-hs="koek" data-label="Speculaaspop" x="286" y="684" width="44" height="50" id="hit-koek3"/>
    <rect class="hit" data-hs="piet" data-label="Klimpiet" x="880" y="500" width="120" height="190"/>
    <rect class="hit" data-hs="zak" data-label="Jutezak met een slot" x="1070" y="570" width="140" height="132"/>
    <rect class="hit" data-hs="ladder" data-label="Ladder" x="1392" y="600" width="114" height="300"/>
  </g>
</svg>
